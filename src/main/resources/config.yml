# Configuration for EnhancedPets

# Optional: name of the language file inside the plugin folder.
# Copy language.yml to another file (for example language_zh.yml), translate it,
# and set this option to that file name to use it.
language-file: language.yml

# GUI and feature toggles.
# Set any option to false to hide it from the pet menus and disable its action.
# Existing pets keep their stored data, but disabled actions cannot be used.
features:
  # Pet behaviour modes shown in the single-pet and batch menus.
  mode-passive: true
  mode-neutral: true
  mode-aggressive: true
  sit: true
  teleport: true
  calm: true
  rename: true
  friendly-players: true
  transfer: true
  protection: true
  station: true
  targeting: true
  creeper-behavior: true
  public-access: true
  heal: true
  storage: true
  free-pet: true
  remove-pet: true
  customization: true
  favorites: true
  growth-control: true
  revive: true
  batch-actions: true
  scan: true
  adoption: true
  incubator: true

# Re-enable pre-1.14 Ocelot taming?
# If true, right-clicking an untamed adult Ocelot with raw Cod or Salmon
# will consume the fish and transform the Ocelot into a tamed Cat.
ocelot-taming-legacy-style: false # Default to false to maintain vanilla behavior

# NEW: Shift double right-click any pet you own to open its GUI?
# If true, right-clicking within a window of 250ms on your OWN pet will open the GUI/
shift-doubleclick-pet-gui: true



# Setup the item for reviving a pet.
# Any valid Minecraft material works, e.g. NETHER_STAR, NETHERITE_SCRAP or DIRT.
revive-item: NETHER_STAR
revive-item-amount: 1
revive-item-require-mainhand: true
# Cost (in XP points, not levels) to heal 1 HP of a pet.
pet-heal-cost: 100

#Require advanced logs? want to check if there's a bug?
#Enable this to receive tons of helpful messages from the plugin in the server console
debug: false

#END OF CONFIGURATION
